name: deeplook

# Rotacao dos logs do Docker (item 6.6): sem isto o json-file cresce sem limite se o
# daemon.json do host nao definir um, e o disco e o mesmo dos dados.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "${LOG_MAX_SIZE:-10m}"
    max-file: "${LOG_MAX_FILE:-3}"

services:
  db:
    image: postgres:16-alpine@sha256:f377d590e5474681d4d7838635031a2b50647923b7abfa803ce9b5ff35d5c663
    restart: unless-stopped
    logging: *default-logging
    # So o que o entrypoint precisa (medido, item 6.20): ajustar a posse da pasta de dados e trocar
    # para o usuario postgres. Sem DAC_OVERRIDE o primeiro boot passa e o REINICIO falha, porque a
    # pasta ja e do postgres com 700. As outras 10 capacidades padrao do Docker saem.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-deeplook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deeplook}
      POSTGRES_DB: ${POSTGRES_DB:-deeplook}
    volumes:
      - ./data/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-deeplook} -d ${POSTGRES_DB:-deeplook}"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - deeplook

  minio:
    image: ${MINIO_IMAGE:-pgsty/silo@sha256:c20d112390b9a9ce8c11b8af95ad35bcaa62f4759663c09c936cd8d2b511f329}
    restart: unless-stopped
    logging: *default-logging
    command: server /data --console-address ":9001"
    # Roda como root (a imagem so troca de usuario com MINIO_USERNAME) numa pasta do host de outro
    # dono: so precisa de DAC_OVERRIDE para gravar nela (medido, item 6.20). Sem ele, nem sobe.
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-deeplook}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-deeplook123}
    volumes:
      - ./data/minio:/data
    ports:
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    networks:
      - deeplook

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    logging: *default-logging
    # Readiness (item 1.2): o banco e o MinIO respondem, entao da para atender.
    # So /api/health diria "saudavel" com o Postgres fora, e o web liberaria o
    # trafego para uma API sem como responder.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/api/health/ready').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
    # Sem limite, um pico derrubaria a maquina inteira, nao so a API.
    mem_limit: ${API_MEM_LIMIT:-4g}
    # Raiz somente leitura (revisao, item 4): o codigo ja era do root e a API roda como node; agora
    # nem a home nem o resto da imagem aceitam escrita. Grava so no /tmp, que e um VOLUME EM DISCO
    # e nao tmpfs: sem BACKUP_DIR o ZIP inteiro do backup e montado ali (e o ISO do sandbox
    # tambem), e em memoria contaria no mem_limit e derrubaria a API num backup grande.
    read_only: true
    # Teto de processos e threads (os workers de analise contam): pico medido no test:images.
    pids_limit: ${API_PIDS_LIMIT:-256}
    # Analisa arquivos maliciosos: sem root (Dockerfile), sem capacidades extras.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-deeplook}:${POSTGRES_PASSWORD:-deeplook}@db:5432/${POSTGRES_DB:-deeplook}?schema=public
      SESSION_SECRET: ${SESSION_SECRET:-change-me-please-use-a-long-random-secret}
      # Chave de dados: cifra o segredo do 2FA. Vazia, a chave sai do SESSION_SECRET (antigo).
      DATA_KEY: ${DATA_KEY:-}
      DATA_KEY_PREVIOUS: ${DATA_KEY_PREVIOUS:-}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
      SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-30}
      SLA_WARN_HOURS: ${SLA_WARN_HOURS:-24}
      SLA_LATE_HOURS: ${SLA_LATE_HOURS:-72}
      SLA_P1_HOURS: ${SLA_P1_HOURS:-2/4}
      SLA_P2_HOURS: ${SLA_P2_HOURS:-8/24}
      SLA_P4_HOURS: ${SLA_P4_HOURS:-72/120}
      SLA_ESCALATE_PRIORITY: ${SLA_ESCALATE_PRIORITY:-false}
      REPORT_REVIEW_REQUIRED: ${REPORT_REVIEW_REQUIRED:-false}
      RETENTION_DAYS: ${RETENTION_DAYS:-0}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      BACKUP_PG_DUMP: ${BACKUP_PG_DUMP:-pg_dump}
      # Pasta dos backups (item 6.13): com BACKUP_DIR no .env, o ZIP vai para /backups (montado
      # abaixo) em vez do bucket. Levar essa pasta para fora do disco e de quem configura.
      BACKUP_DIR: ${BACKUP_DIR:+/backups}
      # Senha do ZIP do backup agendado (dias e horario na aba Backup); vazia, ele nao liga.
      BACKUP_SCHEDULE_PASSWORD: ${BACKUP_SCHEDULE_PASSWORD:-}
      # Log centralizado de alertas (plano pos-revisao, 5.2): com ALERT_LOG_DIR no .env, uma linha
      # JSON por alerta em /alerts/deeplook-alerts.jsonl (montado abaixo), para um coletor levar ao
      # SIEM. Vazio, desligado.
      ALERT_LOG: ${ALERT_LOG_DIR:+/alerts/deeplook-alerts.jsonl}
      # Conferencia de integridade dos arquivos guardados (item 4.2); 0 minutos desliga.
      INTEGRITY_SCRUB_INTERVAL_MINUTES: ${INTEGRITY_SCRUB_INTERVAL_MINUTES:-60}
      INTEGRITY_SCRUB_MAX_MB: ${INTEGRITY_SCRUB_MAX_MB:-512}
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:-}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-}
      LDAP_URL: ${LDAP_URL:-}
      LDAP_STARTTLS: ${LDAP_STARTTLS:-false}
      LDAP_TLS_CA: ${LDAP_TLS_CA:-}
      LDAP_BIND_DN: ${LDAP_BIND_DN:-}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:-}
      LDAP_BASE_DN: ${LDAP_BASE_DN:-}
      LDAP_USER_FILTER: ${LDAP_USER_FILTER:-}
      LDAP_ATTR_NAME: ${LDAP_ATTR_NAME:-displayName}
      LDAP_ATTR_MAIL: ${LDAP_ATTR_MAIL:-mail}
      LDAP_ANALYST_GROUP: ${LDAP_ANALYST_GROUP:-}
      LDAP_ADMIN_GROUP: ${LDAP_ADMIN_GROUP:-}
      LDAP_NESTED_GROUPS: ${LDAP_NESTED_GROUPS:-false}
      PASSWORD_MAX_AGE_DAYS: ${PASSWORD_MAX_AGE_DAYS:-90}
      VT_API_KEY: ${VT_API_KEY:-}
      ABUSECH_AUTH_KEY: ${ABUSECH_AUTH_KEY:-}
      ABUSEIPDB_API_KEY: ${ABUSEIPDB_API_KEY:-}
      # Enriquecimento de links: registro (RDAP) e certificados (crt.sh) sem chave, so por opcao;
      # DNS passivo com a chave do VirusTotal.
      RDAP_ENABLED: ${RDAP_ENABLED:-false}
      CT_ENABLED: ${CT_ENABLED:-false}
      PASSIVE_DNS_ENABLED: ${PASSIVE_DNS_ENABLED:-true}
      # Antivirus: o servico clamav abaixo; CLAMAV_HOST= (vazio) no .env desliga.
      CLAMAV_HOST: ${CLAMAV_HOST-clamav}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      # Captura de pagina: o servico capture abaixo; CAPTURE_URL= (vazio) no .env desliga.
      CAPTURE_URL: ${CAPTURE_URL-http://capture:3100}
      CAPTURE_TOKEN: ${CAPTURE_TOKEN:-troque-este-token-da-captura}
      # Analise de funcoes (item 7.2): o servico capa abaixo; CAPA_URL= (vazio) no .env desliga.
      CAPA_URL: ${CAPA_URL-http://capa:3200}
      CAPA_TOKEN: ${CAPA_TOKEN:-troque-este-token-do-capa}
      CAPA_MAX_MB: ${CAPA_MAX_MB:-32}
      # Espera da API por uma analise: acima de CAPA_TIMEOUT_S + CAPA_FILE_TIMEOUT_S + FLOSS_TIMEOUT_S.
      CAPA_REQUEST_TIMEOUT_S: ${CAPA_REQUEST_TIMEOUT_S:-1100}
      # Analises do capa ao mesmo tempo: o mesmo numero de replicas do servico capa abaixo.
      CAPA_WORKERS: ${CAPA_WORKERS:-2}
      # Analise com o Ghidra (item 7.3), sob demanda: o servico ghidra abaixo; GHIDRA_URL= desliga.
      GHIDRA_URL: ${GHIDRA_URL-http://ghidra:3300}
      GHIDRA_TOKEN: ${GHIDRA_TOKEN:-troque-este-token-do-ghidra}
      GHIDRA_MAX_MB: ${GHIDRA_MAX_MB:-32}
      # Acima do GHIDRA_TIMEOUT_S do servico, com folga para o empacotamento do projeto.
      GHIDRA_REQUEST_TIMEOUT_S: ${GHIDRA_REQUEST_TIMEOUT_S:-1300}
      # Pseudo-C de todas as funcoes: o mesmo teto do servico ghidra.
      GHIDRA_MAX_PSEUDO_MB: ${GHIDRA_MAX_PSEUDO_MB:-32}
      # Identificar e desempacotar (itens 7.8 e 7.9): o servico unpack abaixo; UNPACK_URL= desliga.
      UNPACK_URL: ${UNPACK_URL-http://unpack:3400}
      UNPACK_TOKEN: ${UNPACK_TOKEN:-troque-este-token-do-unpack}
      UNPACK_MAX_MB: ${UNPACK_MAX_MB:-64}
      # Acima do UNPACK_TIMEOUT_S do servico.
      UNPACK_REQUEST_TIMEOUT_S: ${UNPACK_REQUEST_TIMEOUT_S:-400}
      # Office e PDF mais fundo (item 7.14): o servico oletools abaixo; OLETOOLS_URL= desliga.
      OLETOOLS_URL: ${OLETOOLS_URL-http://oletools:3500}
      OLETOOLS_TOKEN: ${OLETOOLS_TOKEN:-troque-este-token-do-oletools}
      OLETOOLS_MAX_MB: ${OLETOOLS_MAX_MB:-32}
      # Acima do OLETOOLS_TIMEOUT_S do servico.
      OLETOOLS_REQUEST_TIMEOUT_S: ${OLETOOLS_REQUEST_TIMEOUT_S:-300}
      # Emulacao de PE e shellcode (plans/novas-analises, item 4): o servico emulate abaixo;
      # EMULATE_URL= desliga.
      EMULATE_URL: ${EMULATE_URL-http://emulate:3600}
      EMULATE_TOKEN: ${EMULATE_TOKEN:-troque-este-token-do-emulate}
      EMULATE_MAX_MB: ${EMULATE_MAX_MB:-32}
      # Acima do EMULATE_TIMEOUT_S do servico.
      EMULATE_REQUEST_TIMEOUT_S: ${EMULATE_REQUEST_TIMEOUT_S:-300}
      # APK/Android (item 6): o servico android abaixo; ANDROID_URL= desliga.
      ANDROID_URL: ${ANDROID_URL-http://android:3700}
      ANDROID_TOKEN: ${ANDROID_TOKEN:-troque-este-token-do-android}
      ANDROID_MAX_MB: ${ANDROID_MAX_MB:-100}
      ANDROID_REQUEST_TIMEOUT_S: ${ANDROID_REQUEST_TIMEOUT_S:-300}
      # Configuracao de familias e dumps de memoria (itens 2 e 3): o servico extract abaixo;
      # EXTRACT_URL= desliga.
      EXTRACT_URL: ${EXTRACT_URL-http://extract:3800}
      EXTRACT_TOKEN: ${EXTRACT_TOKEN:-troque-este-token-do-extract}
      EXTRACT_MAX_MB: ${EXTRACT_MAX_MB:-64}
      EXTRACT_REQUEST_TIMEOUT_S: ${EXTRACT_REQUEST_TIMEOUT_S:-400}
      # Descompilacao de .NET (plans/caca-e-formatos, item 3): o servico dotnet abaixo; DOTNET_URL=
      # desliga.
      DOTNET_URL: ${DOTNET_URL-http://dotnet:3900}
      DOTNET_TOKEN: ${DOTNET_TOKEN:-troque-este-token-do-dotnet}
      DOTNET_MAX_MB: ${DOTNET_MAX_MB:-30}
      DOTNET_REQUEST_TIMEOUT_S: ${DOTNET_REQUEST_TIMEOUT_S:-300}
      # Descompilacao de Java (JAR e .class): o servico jar abaixo; JAR_URL= desliga.
      JAR_URL: ${JAR_URL-http://jar:4000}
      JAR_TOKEN: ${JAR_TOKEN:-troque-este-token-do-jar}
      JAR_MAX_MB: ${JAR_MAX_MB:-30}
      JAR_REQUEST_TIMEOUT_S: ${JAR_REQUEST_TIMEOUT_S:-300}
      # Dump de memoria dos processos da amostra no sandbox (item 3): teto por processo (0 desliga),
      # processos por captura e espera depois da execucao automatica.
      SANDBOX_MEMDUMP_MAX_MB: ${SANDBOX_MEMDUMP_MAX_MB:-512}
      SANDBOX_MEMDUMP_MAX_PROCESSES: ${SANDBOX_MEMDUMP_MAX_PROCESSES:-4}
      SANDBOX_MEMDUMP_DELAY_S: ${SANDBOX_MEMDUMP_DELAY_S:-120}
      # Rascunho do relatorio por IA (item 7), desligado por padrao: anthropic ou openai (servidor
      # compativel, ex.: Ollama). Com anthropic, as evidencias das analises saem para a Anthropic.
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_URL: ${LLM_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TIMEOUT_S: ${LLM_TIMEOUT_S:-180}
      LLM_DAILY_LIMIT: ${LLM_DAILY_LIMIT:-30}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # So a rede deeplook (abaixo) conecta na API e informa o IP do cliente: o capture, na
      # outra rede, abre paginas maliciosas e nao deve alcancar a API (src/lib/network.ts).
      TRUSTED_NETWORK: ${DEEPLOOK_SUBNET:-172.31.250.0/24}
      ALLOW_INSECURE_DEFAULTS: ${ALLOW_INSECURE_DEFAULTS:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@deeplook.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin12345}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-200}
      MAX_UPLOAD_MEMORY_MB: ${MAX_UPLOAD_MEMORY_MB:-600}
      # O que esta chegando fica no /tmp (o volume api-tmp, em disco) ate este total.
      MAX_UPLOAD_SPOOL_MB: ${MAX_UPLOAD_SPOOL_MB:-2048}
      UPLOAD_DAILY_LIMIT: ${UPLOAD_DAILY_LIMIT:-20}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-deeplook}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-deeplook123}
      S3_BUCKET: ${S3_BUCKET:-deeplook-samples}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      # ---- Sandbox (VM isolada no Proxmox VE) ----
      SANDBOX_ENABLED: ${SANDBOX_ENABLED:-false}
      SANDBOX_CONSOLE_ENABLED: ${SANDBOX_CONSOLE_ENABLED:-true}
      PROXMOX_MOCK: ${PROXMOX_MOCK:-false}
      PROXMOX_API_URL: ${PROXMOX_API_URL:-}
      PROXMOX_NODE: ${PROXMOX_NODE:-pve}
      PROXMOX_USER: ${PROXMOX_USER:-}
      PROXMOX_PASSWORD: ${PROXMOX_PASSWORD:-}
      PROXMOX_TEMPLATE_VMID: ${PROXMOX_TEMPLATE_VMID:-0}
      PROXMOX_ISO_STORAGE: ${PROXMOX_ISO_STORAGE:-local}
      PROXMOX_VERIFY_TLS: ${PROXMOX_VERIFY_TLS:-false}
      SANDBOX_TAG: ${SANDBOX_TAG:-deeplook-sandbox}
      SANDBOX_TTL_MINUTES: ${SANDBOX_TTL_MINUTES:-60}
      SANDBOX_MAX_ACTIVE: ${SANDBOX_MAX_ACTIVE:-4}
      SANDBOX_MAX_PER_USER: ${SANDBOX_MAX_PER_USER:-2}
      SANDBOX_MOCK_VNC_URL: ${SANDBOX_MOCK_VNC_URL:-}
      # Artefatos do ambiente: print e processos a cada N segundos (0 desliga).
      SANDBOX_ARTIFACT_INTERVAL_S: ${SANDBOX_ARTIFACT_INTERVAL_S:-60}
      SANDBOX_ARTIFACT_MAX_SHOTS: ${SANDBOX_ARTIFACT_MAX_SHOTS:-60}
      # Captura de rede pelo MikroTik (plano pos-revisao, 5.4): os servicos netcap e suricata so
      # sobem com COMPOSE_PROFILES=netcap; sem MIKROTIK_URL e NETCAP_URL, a captura fica desligada.
      MIKROTIK_URL: ${MIKROTIK_URL:-}
      MIKROTIK_USER: ${MIKROTIK_USER:-}
      MIKROTIK_PASSWORD: ${MIKROTIK_PASSWORD:-}
      MIKROTIK_VERIFY_TLS: ${MIKROTIK_VERIFY_TLS:-false}
      MIKROTIK_SNIFFER_INTERFACE: ${MIKROTIK_SNIFFER_INTERFACE:-}
      NETCAP_URL: ${NETCAP_URL:-}
      NETCAP_TOKEN: ${NETCAP_TOKEN:-}
      NETCAP_STREAM_TARGET: ${NETCAP_STREAM_TARGET:-}
      SURICATA_URL: ${SURICATA_URL:-}
      SURICATA_TOKEN: ${SURICATA_TOKEN:-}
      SURICATA_MAX_MB: ${SURICATA_MAX_MB:-256}
      # Acima do SURICATA_TIMEOUT_S do servico.
      SURICATA_REQUEST_TIMEOUT_S: ${SURICATA_REQUEST_TIMEOUT_S:-660}
    # Sem BACKUP_DIR a pasta montada nao e usada (a API nem a recebe acima).
    volumes:
      - ${BACKUP_DIR:-./data/backups}:/backups
      - ${ALERT_LOG_DIR:-./data/alerts}:/alerts
      - api-tmp:/tmp
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - deeplook
      - capture
      - analysis

  # Antivirus ClamAV: clamd na rede interna (porta 3310, sem expor para fora) e o
  # freshclam atualizando as assinaturas. Usa ~1,5-3 GB de RAM por causa da base.
  clamav:
    image: ${CLAMAV_IMAGE:-clamav/clamav:1.5@sha256:45fe5149fbee5a46509c9848ef20d0c354b7b2323c9369f285939a37cf33422a}
    restart: unless-stopped
    logging: *default-logging
    # Le arquivo malicioso: so o que o /init precisa (medido, item 6.20) para entregar a base e
    # /run/clamav ao usuario clamav (CHOWN, FOWNER), trocar para ele (SETUID, SETGID) e abrir os
    # logs (DAC_OVERRIDE). Saem NET_RAW, MKNOD, SYS_CHROOT e as demais.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./data/clamav:/var/lib/clamav
    networks:
      - deeplook

  # Navegador isolado da captura de pagina (item 80). Fica so na rede "capture", que e
  # interna (item 6.19): sem banco, MinIO ou ClamAV, sem LAN, sem o host e sem saida. A unica
  # porta para a internet e o egress abaixo, que recusa endereco privado, loopback ou de
  # metadados, obedeca o navegador ao proxy dele ou nao.
  capture:
    build:
      context: ./apps/capture
    restart: unless-stopped
    logging: *default-logging
    environment:
      CAPTURE_TOKEN: ${CAPTURE_TOKEN:-troque-este-token-da-captura}
      # Sandbox do proprio Chromium (item 6.16). false so como saida de emergencia num host sem
      # user namespaces: a captura volta a rodar, mas sem o que contem uma pagina maliciosa.
      CAPTURE_CHROMIUM_SANDBOX: ${CAPTURE_CHROMIUM_SANDBOX:-true}
      # Um container por captura (item 6.17): depois de responder, o processo sai e o
      # restart abaixo sobe um container limpo. false = processo de longa vida, como antes.
      CAPTURE_RECYCLE: ${CAPTURE_RECYCLE:-true}
      # Todo o trafego do navegador sai pelo egress (item 6.19).
      CAPTURE_EGRESS_PROXY: http://egress:3128
    # Somente leitura: o Chromium so escreve o perfil temporario, em /tmp (tmpfs, em memoria,
    # sem executaveis). Junto com o container novo a cada captura, nada sobra de uma para outra.
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid,nodev
    shm_size: 512m
    mem_limit: 1g
    pids_limit: 512
    # Abre paginas maliciosas: sem capacidades extras, como a API. O perfil seccomp e o padrao
    # do Docker mais o minimo para o sandbox do proprio Chromium subir (user/pid/net namespace e
    # chroot; gerado por scripts/seccomp-chromium.mjs). Sem ele, o navegador nao abre.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp=./apps/capture/seccomp-chromium.json
    depends_on:
      egress:
        condition: service_healthy
    networks:
      - capture

  # Analise de funcoes (item 7.2): capa e FLOSS, da Mandiant. Le e emula o codigo de executaveis
  # maliciosos dentro do vivisect (Python), entao fica como a captura: sem rede nenhuma (nem o
  # egress; nada aqui precisa da internet), raiz somente leitura, sem capacidades e sem root, e um
  # container novo a cada analise.
  capa:
    build:
      context: ./apps/capa
    restart: unless-stopped
    # Um container por analise em andamento: um executavel grande prende o seu por ate 15 min
    # (capa 600 s + FLOSS 300 s) e os outros seguem. A API manda cada analise a uma replica livre.
    # Cada uma pode usar ate CAPA_MEM_LIMIT de memoria.
    deploy:
      replicas: ${CAPA_WORKERS:-2}
    logging: *default-logging
    environment:
      CAPA_TOKEN: ${CAPA_TOKEN:-troque-este-token-do-capa}
      CAPA_MAX_MB: ${CAPA_MAX_MB:-32}
      # Tetos de cada ferramenta: um PE com milhares de funcoes passa de 15 min no capa.
      CAPA_TIMEOUT_S: ${CAPA_TIMEOUT_S:-600}
      FLOSS_TIMEOUT_S: ${FLOSS_TIMEOUT_S:-300}
      # O FLOSS reaproveita a analise do capa em executaveis do Windows ate este tamanho (MB): mesmo
      # resultado, mais rapido. A analise salva fica no /tmp abaixo (7 a 11 vezes o executavel).
      CAPA_REUSE_MAX_MB: ${CAPA_REUSE_MAX_MB:-8}
      # Executavel do Windows cuja analise de funcoes nao terminou: as regras so do nivel do arquivo,
      # com este teto (s). 0 desliga.
      CAPA_FILE_TIMEOUT_S: ${CAPA_FILE_TIMEOUT_S:-60}
      # Um container por analise (como a captura, item 6.17). false = processo de longa vida.
      CAPA_RECYCLE: ${CAPA_RECYCLE:-true}
    # O unico lugar gravavel e o /tmp em memoria, sem executaveis: a amostra e o JSON das
    # ferramentas. O cache das regras ja vem pronto na imagem.
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid,nodev
    # Medido: 1,8 GB num PE de 4.000 funcoes. Acima do teto, o kernel mata a ferramenta (a
    # analise falha com o motivo) e o servidor segue de pe.
    mem_limit: ${CAPA_MEM_LIMIT:-3g}
    pids_limit: 64
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - analysis

  # Analise com o Ghidra (item 7.3), sob demanda. Mesmo isolamento do capa: sem rede nenhuma, raiz
  # somente leitura, sem capacidades e sem root, um container por analise. So gasta memoria e CPU
  # quando um analista pede.
  ghidra:
    build:
      context: ./apps/ghidra
    restart: unless-stopped
    logging: *default-logging
    environment:
      GHIDRA_TOKEN: ${GHIDRA_TOKEN:-troque-este-token-do-ghidra}
      GHIDRA_MAX_MB: ${GHIDRA_MAX_MB:-32}
      # Teto da primeira passada (a analise automatica para em 70% dele e o resumo ainda sai).
      GHIDRA_TIMEOUT_S: ${GHIDRA_TIMEOUT_S:-900}
      # Heap do Java; o container precisa de folga para o descompilador (processo nativo) e o /tmp.
      GHIDRA_HEADLESS_MAXMEM: ${GHIDRA_HEADLESS_MAXMEM:-3G}
      GHIDRA_RECYCLE: ${GHIDRA_RECYCLE:-true}
      # Memoria de cada processo do descompilador nativo (MB; ate dois, fora o heap). 0 desliga.
      GHIDRA_DECOMPILER_MAX_MB: ${GHIDRA_DECOMPILER_MAX_MB:-1024}
      # Acima disto (MB), a analise comeca sem o analisador de switch (mais rapida). 0 desliga.
      GHIDRA_LIGHT_MB: ${GHIDRA_LIGHT_MB:-5}
      # Pseudo-C de todas as funcoes: teto do codigo somado (MB).
      GHIDRA_MAX_PSEUDO_MB: ${GHIDRA_MAX_PSEUDO_MB:-32}
    # O projeto do Ghidra, a amostra e o .gzf ficam no /tmp em memoria, sem executaveis (o
    # descompilador nativo roda de /opt, somente leitura).
    read_only: true
    tmpfs:
      - /tmp:size=1g,noexec,nosuid,nodev
    # Medido: 700 MB num executavel pequeno. O teto cobre o heap (3 GB), o descompilador e o /tmp.
    mem_limit: ${GHIDRA_MEM_LIMIT:-6g}
    # O Java usa muitas threads (cada uma conta como processo).
    pids_limit: 256
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - analysis

  # Identificar e desempacotar (itens 7.8 e 7.9): Detect It Easy, upx, 7-Zip, innoextract e
  # pyinstxtractor. So le e extrai; nada da amostra roda. Mesmo isolamento do capa e um container por trabalho.
  unpack:
    build:
      context: ./apps/unpack
    restart: unless-stopped
    logging: *default-logging
    environment:
      UNPACK_TOKEN: ${UNPACK_TOKEN:-troque-este-token-do-unpack}
      UNPACK_MAX_MB: ${UNPACK_MAX_MB:-64}
      UNPACK_TIMEOUT_S: ${UNPACK_TIMEOUT_S:-180}
      # Teto do que sai de uma amostra (contra zip bomb e instalador gigante).
      UNPACK_MAX_FILES: ${UNPACK_MAX_FILES:-50}
      UNPACK_MAX_TOTAL_MB: ${UNPACK_MAX_TOTAL_MB:-256}
      UNPACK_RECYCLE: ${UNPACK_RECYCLE:-true}
    # A amostra, o que sai dela e o ZIP da resposta ficam no /tmp em memoria, sem executaveis: um
    # instalador que estoure o /tmp so faz o trabalho falhar.
    read_only: true
    tmpfs:
      - /tmp:size=1g,noexec,nosuid,nodev
    mem_limit: ${UNPACK_MEM_LIMIT:-2g}
    pids_limit: 64
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - analysis

  # Office e PDF mais fundo (item 7.14; revisao de novembro, 3.2): oletools (olevba, MacroRaptor,
  # msodde, oleid, rtfobj). So le: nenhuma macro e executada. Mesmo isolamento do capa: sem rede,
  # raiz somente leitura, sem capacidades e sem root, um container por analise.
  oletools:
    build:
      context: ./apps/oletools
    restart: unless-stopped
    logging: *default-logging
    environment:
      OLETOOLS_TOKEN: ${OLETOOLS_TOKEN:-troque-este-token-do-oletools}
      OLETOOLS_MAX_MB: ${OLETOOLS_MAX_MB:-32}
      OLETOOLS_TIMEOUT_S: ${OLETOOLS_TIMEOUT_S:-120}
      OLETOOLS_RECYCLE: ${OLETOOLS_RECYCLE:-true}
    # O documento fica no /tmp em memoria, sem executaveis.
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid,nodev
    mem_limit: ${OLETOOLS_MEM_LIMIT:-1g}
    pids_limit: 64
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - analysis

  # Emulacao de PE e shellcode (plans/novas-analises, item 4): Speakeasy, sem rede (a rede que a
  # amostra ve e a simulada pelo proprio emulador). Um container por analise, como o oletools.
  emulate:
    build:
      context: ./apps/emulate
    restart: unless-stopped
    logging: *default-logging
    environment:
      EMULATE_TOKEN: ${EMULATE_TOKEN:-troque-este-token-do-emulate}
      EMULATE_MAX_MB: ${EMULATE_MAX_MB:-32}
      EMULATE_TIMEOUT_S: ${EMULATE_TIMEOUT_S:-180}
      # Tempo de emulacao (o Speakeasy para sozinho) e teto de chamadas de API.
      EMULATE_RUN_S: ${EMULATE_RUN_S:-60}
      EMULATE_RECYCLE: ${EMULATE_RECYCLE:-true}
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid,nodev
    mem_limit: ${EMULATE_MEM_LIMIT:-1g}
    pids_limit: 64
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - analysis

  # APK/Android (item 6): androguard, sem rede; so le o manifesto, os certificados e os DEX.
  android:
    build:
      context: ./apps/android
    restart: unless-stopped
    logging: *default-logging
    environment:
      ANDROID_TOKEN: ${ANDROID_TOKEN:-troque-este-token-do-android}
      ANDROID_MAX_MB: ${ANDROID_MAX_MB:-100}
      ANDROID_TIMEOUT_S: ${ANDROID_TIMEOUT_S:-180}
      ANDROID_RECYCLE: ${ANDROID_RECYCLE:-true}
    read_only: true
    tmpfs:
      - /tmp:size=512m,noexec,nosuid,nodev
    mem_limit: ${ANDROID_MEM_LIMIT:-1g}
    pids_limit: 64
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - analysis

  # Configuracao de familias (item 2) e dumps de memoria do sandbox (item 3): CAPE-parsers (GPL,
  # isolado aqui; a API so fala HTTP) e minidump, sem rede.
  extract:
    build:
      context: ./apps/extract
    restart: unless-stopped
    logging: *default-logging
    environment:
      EXTRACT_TOKEN: ${EXTRACT_TOKEN:-troque-este-token-do-extract}
      # Maior corpo aceito: o dump de memoria (gzip) e maior que um executavel.
      EXTRACT_MAX_MB: ${EXTRACT_SERVICE_MAX_MB:-512}
      # Dump descompactado (o mesmo teto do SANDBOX_MEMDUMP_MAX_MB da API).
      EXTRACT_MEMDUMP_MAX_MB: ${SANDBOX_MEMDUMP_MAX_MB:-512}
      EXTRACT_TIMEOUT_S: ${EXTRACT_TIMEOUT_S:-300}
      EXTRACT_RECYCLE: ${EXTRACT_RECYCLE:-true}
    read_only: true
    tmpfs:
      # O dump (gzip) e ele descompactado ficam aqui durante a analise.
      - /tmp:size=1200m,noexec,nosuid,nodev
    mem_limit: ${EXTRACT_MEM_LIMIT:-3g}
    pids_limit: 64
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - analysis

  # Descompilacao de .NET (plans/caca-e-formatos, item 3): ilspycmd (MIT), binario nativo, sem o
  # runtime do .NET. So le o IL e os metadados; nada e executado. Um container por analise.
  dotnet:
    build:
      context: ./apps/dotnet
    restart: unless-stopped
    logging: *default-logging
    environment:
      DOTNET_TOKEN: ${DOTNET_TOKEN:-troque-este-token-do-dotnet}
      DOTNET_MAX_MB: ${DOTNET_MAX_MB:-30}
      DOTNET_TIMEOUT_S: ${DOTNET_TIMEOUT_S:-240}
      DOTNET_DECOMPILE_S: ${DOTNET_DECOMPILE_S:-200}
      DOTNET_RECYCLE: ${DOTNET_RECYCLE:-true}
    read_only: true
    tmpfs:
      # O assembly e o projeto descompilado ficam aqui durante a analise.
      - /tmp:size=512m,noexec,nosuid,nodev
    mem_limit: ${DOTNET_MEM_LIMIT:-2g}
    pids_limit: 64
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - analysis

  # Descompilacao de Java: CFR (MIT) numa JRE headless. So le o bytecode; nada e executado. Um
  # container por analise. A JVM usa mais threads que o Python: o teto de processos e maior.
  jar:
    build:
      context: ./apps/jarcfr
    restart: unless-stopped
    logging: *default-logging
    environment:
      JAR_TOKEN: ${JAR_TOKEN:-troque-este-token-do-jar}
      JAR_MAX_MB: ${JAR_MAX_MB:-30}
      JAR_TIMEOUT_S: ${JAR_TIMEOUT_S:-240}
      JAR_DECOMPILE_S: ${JAR_DECOMPILE_S:-200}
      JAR_RECYCLE: ${JAR_RECYCLE:-true}
    read_only: true
    tmpfs:
      # O JAR e o fonte descompilado ficam aqui durante a analise.
      - /tmp:size=512m,noexec,nosuid,nodev
    mem_limit: ${JAR_MEM_LIMIT:-2g}
    pids_limit: 128
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - analysis

  # Captura de rede do sandbox (plano pos-revisao, 5.4): recebe por UDP o TZSP do sniffer do
  # MikroTik CHR e grava um pcap por ambiente num tmpfs. So le o cabecalho TZSP e os MACs; quem
  # interpreta o trafego e o Suricata. A porta UDP e publicada no host para o CHR alcanca-la:
  # libere no firewall so do IP do CHR (e, de preferencia, NETCAP_TZSP_SOURCES com o mesmo IP).
  netcap:
    build:
      context: ./apps/netcap
    profiles: [netcap]
    restart: unless-stopped
    logging: *default-logging
    environment:
      NETCAP_TOKEN: ${NETCAP_TOKEN:-}
      NETCAP_MAX_MB: ${NETCAP_MAX_MB:-200}
      NETCAP_TZSP_SOURCES: ${NETCAP_TZSP_SOURCES:-}
    ports:
      - ${NETCAP_TZSP_BIND:-0.0.0.0}:${NETCAP_TZSP_PORT:-37008}:37008/udp
    read_only: true
    tmpfs:
      - /data:size=${NETCAP_TMPFS:-1g},noexec,nosuid,nodev,uid=1000
    mem_limit: 256m
    pids_limit: 32
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - analysis
      - netcap-in

  # Suricata sobre o pcap (plano pos-revisao, 5.4): `suricata -r` com as regras ET Open, um
  # container por analise. As regras ficam no volume e sao baixadas pelo egress (a saida
  # controlada); a analise em si nao usa rede.
  suricata:
    build:
      context: ./apps/suricata
    profiles: [netcap]
    restart: unless-stopped
    logging: *default-logging
    environment:
      SURICATA_TOKEN: ${SURICATA_TOKEN:-}
      SURICATA_MAX_MB: ${SURICATA_MAX_MB:-256}
      SURICATA_TIMEOUT_S: ${SURICATA_TIMEOUT_S:-600}
      SURICATA_UPDATE_HOURS: ${SURICATA_UPDATE_HOURS:-24}
      SURICATA_RECYCLE: ${SURICATA_RECYCLE:-true}
      HTTPS_PROXY: http://egress:3128
      HTTP_PROXY: http://egress:3128
    read_only: true
    tmpfs:
      - /tmp:size=1g,noexec,nosuid,nodev
    volumes:
      - suricata-rules:/var/lib/suricata
    mem_limit: ${SURICATA_MEM_LIMIT:-2g}
    pids_limit: 128
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - analysis
      - suricata-egress

  # Proxy de saida da captura (item 6.19): o unico caminho do navegador ate a internet. Resolve
  # o nome uma vez, recusa rede interna, loopback e metadados e conecta no IP conferido. So Node,
  # sem navegador; nao roda codigo de pagina. Na rede interna da captura e numa rede com saida.
  egress:
    build:
      context: ./apps/capture
      dockerfile: Dockerfile.egress
    restart: unless-stopped
    logging: *default-logging
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 64
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3128/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - capture
      - capture-egress
      # So o suricata, para baixar as regras ET Open (plano pos-revisao, 5.4).
      - suricata-egress

  web:
    build:
      context: ./apps/web
    restart: unless-stopped
    logging: *default-logging
    # Porta de entrada (atras do Cloudflare Tunnel), endurecida como a API e o capture
    # (item 6.5): sem root (imagem nginx-unprivileged, porta 8080 interna), sem
    # capacidades, sistema de arquivos somente leitura (o nginx so escreve em /tmp) e com
    # limites. O images.mjs roda o web com ESTA configuracao, lida daqui.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: ${WEB_MEM_LIMIT:-256m}
    pids_limit: 128
    environment:
      # De onde o nginx aceita o CF-Connecting-IP (alem do loopback): o gateway da rede deeplook,
      # que e como o cloudflared do host chega pela porta publicada. Trocou DEEPLOOK_SUBNET? Este
      # e o primeiro endereco dela. Aceita um endereco ou uma faixa CIDR.
      REAL_IP_FROM: ${REAL_IP_FROM:-172.31.250.1}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    networks:
      - deeplook

volumes:
  # O /tmp da API (revisao, item 4): em disco, e limpo das sobras de backup e ISO a cada subida.
  api-tmp:
  # Regras do Suricata (ET Open): sobrevivem a troca de container a cada analise.
  suricata-rules:

networks:
  deeplook:
    driver: bridge
    # Sub-rede fixa: e a unica de onde a API aceita conexao (TRUSTED_NETWORK). Se ela colidir
    # com outra rede do host, troque DEEPLOOK_SUBNET no .env (uma /24 basta).
    ipam:
      config:
        - subnet: ${DEEPLOOK_SUBNET:-172.31.250.0/24}
  # A API, o navegador isolado e o egress. Interna (item 6.19): sem rota para fora, sem DNS
  # externo e, com inhibit_ipv4 (Docker 28+), sem IP do host na bridge, entao nem o proprio host
  # e alcancavel. Os containers se veem pelo nome. Mudou isto? `docker compose down` antes do up.
  capture:
    driver: bridge
    internal: true
    driver_opts:
      com.docker.network.bridge.inhibit_ipv4: "true"
  # A API, o capa (item 7.2), o Ghidra (7.3) e o unpack (7.8). Interna e sem IP do host na bridge,
  # como a da captura: eles nao alcancam nada alem da API, nem a internet.
  analysis:
    driver: bridge
    internal: true
    driver_opts:
      com.docker.network.bridge.inhibit_ipv4: "true"
  # So o egress: e por aqui que a captura chega a internet. Sub-rede fixa para o host poder
  # manda-la por uma VPN com roteamento por origem (docs/implantacao.md, passo 3), sem que a
  # captura saia pelo IP da casa. Se colidir com outra rede do host, troque no .env.
  capture-egress:
    driver: bridge
    ipam:
      config:
        - subnet: ${CAPTURE_EGRESS_SUBNET:-172.31.252.0/24}
  # O suricata e o egress (plano pos-revisao, 5.4): interna, so para as regras saírem pelo proxy.
  suricata-egress:
    driver: bridge
    internal: true
    driver_opts:
      com.docker.network.bridge.inhibit_ipv4: "true"
  # Entrada do TZSP do MikroTik no netcap: precisa ser uma bridge comum para a porta UDP ser
  # publicada no host.
  netcap-in:
    driver: bridge
