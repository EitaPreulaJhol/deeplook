name: deeplook

# Rotacao dos logs do Docker (item 6.6): sem isto o json-file cresce sem limite se o
# daemon.json do host nao definir um, e o disco e o mesmo dos dados.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "${LOG_MAX_SIZE:-10m}"
    max-file: "${LOG_MAX_FILE:-3}"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    # So o que o entrypoint precisa (medido, item 6.20): ajustar a posse da pasta de dados e trocar
    # para o usuario postgres. Sem DAC_OVERRIDE o primeiro boot passa e o REINICIO falha, porque a
    # pasta ja e do postgres com 700. As outras 10 capacidades padrao do Docker saem.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-deeplook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deeplook}
      POSTGRES_DB: ${POSTGRES_DB:-deeplook}
    volumes:
      - ./data/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-deeplook} -d ${POSTGRES_DB:-deeplook}"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - deeplook

  minio:
    image: ${MINIO_IMAGE:-pgsty/silo@sha256:7bb2aff6b89efe1cb1303c10fc21d579447434ed06649ac9ec05a5e2dbf30ad7}
    restart: unless-stopped
    logging: *default-logging
    command: server /data --console-address ":9001"
    # Roda como root (a imagem so troca de usuario com MINIO_USERNAME) numa pasta do host de outro
    # dono: so precisa de DAC_OVERRIDE para gravar nela (medido, item 6.20). Sem ele, nem sobe.
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-deeplook}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-deeplook123}
    volumes:
      - ./data/minio:/data
    ports:
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    networks:
      - deeplook

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    logging: *default-logging
    # Readiness (item 1.2): o banco e o MinIO respondem, entao da para atender.
    # So /api/health diria "saudavel" com o Postgres fora, e o web liberaria o
    # trafego para uma API sem como responder.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/api/health/ready').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
    # Sem limite, um pico derrubaria a maquina inteira, nao so a API.
    mem_limit: ${API_MEM_LIMIT:-4g}
    # Raiz somente leitura (revisao, item 4): o codigo ja era do root e a API roda como node; agora
    # nem a home nem o resto da imagem aceitam escrita. Grava so no /tmp, que e um VOLUME EM DISCO
    # e nao tmpfs: sem BACKUP_DIR o ZIP inteiro do backup e montado ali (e o ISO do sandbox
    # tambem), e em memoria contaria no mem_limit e derrubaria a API num backup grande.
    read_only: true
    # Teto de processos e threads (os workers de analise contam): pico medido no test:images.
    pids_limit: ${API_PIDS_LIMIT:-256}
    # Analisa arquivos maliciosos: sem root (Dockerfile), sem capacidades extras.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-deeplook}:${POSTGRES_PASSWORD:-deeplook}@db:5432/${POSTGRES_DB:-deeplook}?schema=public
      SESSION_SECRET: ${SESSION_SECRET:-change-me-please-use-a-long-random-secret}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
      SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-30}
      SLA_WARN_HOURS: ${SLA_WARN_HOURS:-24}
      SLA_LATE_HOURS: ${SLA_LATE_HOURS:-72}
      SLA_P1_HOURS: ${SLA_P1_HOURS:-2/4}
      SLA_P2_HOURS: ${SLA_P2_HOURS:-8/24}
      SLA_P4_HOURS: ${SLA_P4_HOURS:-72/120}
      SLA_ESCALATE_PRIORITY: ${SLA_ESCALATE_PRIORITY:-false}
      REPORT_REVIEW_REQUIRED: ${REPORT_REVIEW_REQUIRED:-false}
      RETENTION_DAYS: ${RETENTION_DAYS:-0}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      # Pasta dos backups (item 6.13): com BACKUP_DIR no .env, o ZIP vai para /backups (montado
      # abaixo) em vez do bucket. Levar essa pasta para fora do disco e de quem configura.
      BACKUP_DIR: ${BACKUP_DIR:+/backups}
      # Senha do ZIP do backup agendado (dias e horario na aba Backup); vazia, ele nao liga.
      BACKUP_SCHEDULE_PASSWORD: ${BACKUP_SCHEDULE_PASSWORD:-}
      # Conferencia de integridade dos arquivos guardados (item 4.2); 0 minutos desliga.
      INTEGRITY_SCRUB_INTERVAL_MINUTES: ${INTEGRITY_SCRUB_INTERVAL_MINUTES:-60}
      INTEGRITY_SCRUB_MAX_MB: ${INTEGRITY_SCRUB_MAX_MB:-512}
      LDAP_URL: ${LDAP_URL:-}
      LDAP_STARTTLS: ${LDAP_STARTTLS:-false}
      LDAP_TLS_CA: ${LDAP_TLS_CA:-}
      LDAP_BIND_DN: ${LDAP_BIND_DN:-}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:-}
      LDAP_BASE_DN: ${LDAP_BASE_DN:-}
      LDAP_USER_FILTER: ${LDAP_USER_FILTER:-}
      LDAP_ATTR_NAME: ${LDAP_ATTR_NAME:-displayName}
      LDAP_ATTR_MAIL: ${LDAP_ATTR_MAIL:-mail}
      LDAP_ANALYST_GROUP: ${LDAP_ANALYST_GROUP:-}
      LDAP_ADMIN_GROUP: ${LDAP_ADMIN_GROUP:-}
      LDAP_NESTED_GROUPS: ${LDAP_NESTED_GROUPS:-false}
      PASSWORD_MAX_AGE_DAYS: ${PASSWORD_MAX_AGE_DAYS:-90}
      VT_API_KEY: ${VT_API_KEY:-}
      ABUSECH_AUTH_KEY: ${ABUSECH_AUTH_KEY:-}
      ABUSEIPDB_API_KEY: ${ABUSEIPDB_API_KEY:-}
      # Antivirus: o servico clamav abaixo; CLAMAV_HOST= (vazio) no .env desliga.
      CLAMAV_HOST: ${CLAMAV_HOST-clamav}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      # Captura de pagina: o servico capture abaixo; CAPTURE_URL= (vazio) no .env desliga.
      CAPTURE_URL: ${CAPTURE_URL-http://capture:3100}
      CAPTURE_TOKEN: ${CAPTURE_TOKEN:-troque-este-token-da-captura}
      # Analise de funcoes (item 7.2): o servico capa abaixo; CAPA_URL= (vazio) no .env desliga.
      CAPA_URL: ${CAPA_URL-http://capa:3200}
      CAPA_TOKEN: ${CAPA_TOKEN:-troque-este-token-do-capa}
      CAPA_MAX_MB: ${CAPA_MAX_MB:-32}
      # Analise com o Ghidra (item 7.3), sob demanda: o servico ghidra abaixo; GHIDRA_URL= desliga.
      GHIDRA_URL: ${GHIDRA_URL-http://ghidra:3300}
      GHIDRA_TOKEN: ${GHIDRA_TOKEN:-troque-este-token-do-ghidra}
      GHIDRA_MAX_MB: ${GHIDRA_MAX_MB:-32}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # So a rede deeplook (abaixo) conecta na API e informa o IP do cliente: o capture, na
      # outra rede, abre paginas maliciosas e nao deve alcancar a API (src/lib/network.ts).
      TRUSTED_NETWORK: ${DEEPLOOK_SUBNET:-172.31.250.0/24}
      ALLOW_INSECURE_DEFAULTS: ${ALLOW_INSECURE_DEFAULTS:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@deeplook.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin12345}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-200}
      MAX_UPLOAD_MEMORY_MB: ${MAX_UPLOAD_MEMORY_MB:-600}
      UPLOAD_DAILY_LIMIT: ${UPLOAD_DAILY_LIMIT:-20}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-deeplook}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-deeplook123}
      S3_BUCKET: ${S3_BUCKET:-deeplook-samples}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      # ---- Sandbox (VM isolada no Proxmox VE) ----
      SANDBOX_ENABLED: ${SANDBOX_ENABLED:-false}
      SANDBOX_CONSOLE_ENABLED: ${SANDBOX_CONSOLE_ENABLED:-true}
      PROXMOX_MOCK: ${PROXMOX_MOCK:-false}
      PROXMOX_API_URL: ${PROXMOX_API_URL:-}
      PROXMOX_NODE: ${PROXMOX_NODE:-pve}
      PROXMOX_USER: ${PROXMOX_USER:-}
      PROXMOX_PASSWORD: ${PROXMOX_PASSWORD:-}
      PROXMOX_TEMPLATE_VMID: ${PROXMOX_TEMPLATE_VMID:-0}
      PROXMOX_ISO_STORAGE: ${PROXMOX_ISO_STORAGE:-local}
      PROXMOX_VERIFY_TLS: ${PROXMOX_VERIFY_TLS:-false}
      SANDBOX_TAG: ${SANDBOX_TAG:-deeplook-sandbox}
      SANDBOX_TTL_MINUTES: ${SANDBOX_TTL_MINUTES:-60}
      SANDBOX_MAX_ACTIVE: ${SANDBOX_MAX_ACTIVE:-4}
      SANDBOX_MAX_PER_USER: ${SANDBOX_MAX_PER_USER:-2}
      SANDBOX_MOCK_VNC_URL: ${SANDBOX_MOCK_VNC_URL:-}
    # Sem BACKUP_DIR a pasta montada nao e usada (a API nem a recebe acima).
    volumes:
      - ${BACKUP_DIR:-./data/backups}:/backups
      - api-tmp:/tmp
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - deeplook
      - capture
      - analysis

  # Antivirus ClamAV: clamd na rede interna (porta 3310, sem expor para fora) e o
  # freshclam atualizando as assinaturas. Usa ~1,5-3 GB de RAM por causa da base.
  clamav:
    image: ${CLAMAV_IMAGE:-clamav/clamav:1.5}
    restart: unless-stopped
    logging: *default-logging
    # Le arquivo malicioso: so o que o /init precisa (medido, item 6.20) para entregar a base e
    # /run/clamav ao usuario clamav (CHOWN, FOWNER), trocar para ele (SETUID, SETGID) e abrir os
    # logs (DAC_OVERRIDE). Saem NET_RAW, MKNOD, SYS_CHROOT e as demais.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./data/clamav:/var/lib/clamav
    networks:
      - deeplook

  # Navegador isolado da captura de pagina (item 80). Fica so na rede "capture", que e
  # interna (item 6.19): sem banco, MinIO ou ClamAV, sem LAN, sem o host e sem saida. A unica
  # porta para a internet e o egress abaixo, que recusa endereco privado, loopback ou de
  # metadados, obedeca o navegador ao proxy dele ou nao.
  capture:
    build:
      context: ./apps/capture
    restart: unless-stopped
    logging: *default-logging
    environment:
      CAPTURE_TOKEN: ${CAPTURE_TOKEN:-troque-este-token-da-captura}
      # Sandbox do proprio Chromium (item 6.16). false so como saida de emergencia num host sem
      # user namespaces: a captura volta a rodar, mas sem o que contem uma pagina maliciosa.
      CAPTURE_CHROMIUM_SANDBOX: ${CAPTURE_CHROMIUM_SANDBOX:-true}
      # Um container por captura (item 6.17): depois de responder, o processo sai e o
      # restart abaixo sobe um container limpo. false = processo de longa vida, como antes.
      CAPTURE_RECYCLE: ${CAPTURE_RECYCLE:-true}
      # Todo o trafego do navegador sai pelo egress (item 6.19).
      CAPTURE_EGRESS_PROXY: http://egress:3128
    # Somente leitura: o Chromium so escreve o perfil temporario, em /tmp (tmpfs, em memoria,
    # sem executaveis). Junto com o container novo a cada captura, nada sobra de uma para outra.
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid,nodev
    shm_size: 512m
    mem_limit: 1g
    pids_limit: 512
    # Abre paginas maliciosas: sem capacidades extras, como a API. O perfil seccomp e o padrao
    # do Docker mais o minimo para o sandbox do proprio Chromium subir (user/pid/net namespace e
    # chroot; gerado por scripts/seccomp-chromium.mjs). Sem ele, o navegador nao abre.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp=./apps/capture/seccomp-chromium.json
    depends_on:
      egress:
        condition: service_healthy
    networks:
      - capture

  # Analise de funcoes (item 7.2): capa e FLOSS, da Mandiant. Le e emula o codigo de executaveis
  # maliciosos dentro do vivisect (Python), entao fica como a captura: sem rede nenhuma (nem o
  # egress; nada aqui precisa da internet), raiz somente leitura, sem capacidades e sem root, e um
  # container novo a cada analise.
  capa:
    build:
      context: ./apps/capa
    restart: unless-stopped
    logging: *default-logging
    environment:
      CAPA_TOKEN: ${CAPA_TOKEN:-troque-este-token-do-capa}
      CAPA_MAX_MB: ${CAPA_MAX_MB:-32}
      # Tetos de cada ferramenta: um PE com milhares de funcoes passa de 15 min no capa.
      CAPA_TIMEOUT_S: ${CAPA_TIMEOUT_S:-600}
      FLOSS_TIMEOUT_S: ${FLOSS_TIMEOUT_S:-300}
      # Um container por analise (como a captura, item 6.17). false = processo de longa vida.
      CAPA_RECYCLE: ${CAPA_RECYCLE:-true}
    # O unico lugar gravavel e o /tmp em memoria, sem executaveis: a amostra e o JSON das
    # ferramentas. O cache das regras ja vem pronto na imagem.
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid,nodev
    # Medido: 1,8 GB num PE de 4.000 funcoes. Acima do teto, o kernel mata a ferramenta (a
    # analise falha com o motivo) e o servidor segue de pe.
    mem_limit: ${CAPA_MEM_LIMIT:-3g}
    pids_limit: 64
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - analysis

  # Analise com o Ghidra (item 7.3), sob demanda. Mesmo isolamento do capa: sem rede nenhuma, raiz
  # somente leitura, sem capacidades e sem root, um container por analise. So gasta memoria e CPU
  # quando um analista pede.
  ghidra:
    build:
      context: ./apps/ghidra
    restart: unless-stopped
    logging: *default-logging
    environment:
      GHIDRA_TOKEN: ${GHIDRA_TOKEN:-troque-este-token-do-ghidra}
      GHIDRA_MAX_MB: ${GHIDRA_MAX_MB:-32}
      # Teto da primeira passada (a analise automatica para em 70% dele e o resumo ainda sai).
      GHIDRA_TIMEOUT_S: ${GHIDRA_TIMEOUT_S:-900}
      # Heap do Java; o container precisa de folga para o descompilador (processo nativo) e o /tmp.
      GHIDRA_HEADLESS_MAXMEM: ${GHIDRA_HEADLESS_MAXMEM:-3G}
      GHIDRA_RECYCLE: ${GHIDRA_RECYCLE:-true}
    # O projeto do Ghidra, a amostra e o .gzf ficam no /tmp em memoria, sem executaveis (o
    # descompilador nativo roda de /opt, somente leitura).
    read_only: true
    tmpfs:
      - /tmp:size=1g,noexec,nosuid,nodev
    # Medido: 700 MB num executavel pequeno. O teto cobre o heap (3 GB), o descompilador e o /tmp.
    mem_limit: ${GHIDRA_MEM_LIMIT:-6g}
    # O Java usa muitas threads (cada uma conta como processo).
    pids_limit: 256
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - analysis

  # Proxy de saida da captura (item 6.19): o unico caminho do navegador ate a internet. Resolve
  # o nome uma vez, recusa rede interna, loopback e metadados e conecta no IP conferido. So Node,
  # sem navegador; nao roda codigo de pagina. Na rede interna da captura e numa rede com saida.
  egress:
    build:
      context: ./apps/capture
      dockerfile: Dockerfile.egress
    restart: unless-stopped
    logging: *default-logging
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 64
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3128/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - capture
      - capture-egress

  web:
    build:
      context: ./apps/web
    restart: unless-stopped
    logging: *default-logging
    # Porta de entrada (atras do Cloudflare Tunnel), endurecida como a API e o capture
    # (item 6.5): sem root (imagem nginx-unprivileged, porta 8080 interna), sem
    # capacidades, sistema de arquivos somente leitura (o nginx so escreve em /tmp) e com
    # limites. O images.mjs roda o web com ESTA configuracao, lida daqui.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: ${WEB_MEM_LIMIT:-256m}
    pids_limit: 128
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    networks:
      - deeplook

volumes:
  # O /tmp da API (revisao, item 4): em disco, e limpo das sobras de backup e ISO a cada subida.
  api-tmp:

networks:
  deeplook:
    driver: bridge
    # Sub-rede fixa: e a unica de onde a API aceita conexao (TRUSTED_NETWORK). Se ela colidir
    # com outra rede do host, troque DEEPLOOK_SUBNET no .env (uma /24 basta).
    ipam:
      config:
        - subnet: ${DEEPLOOK_SUBNET:-172.31.250.0/24}
  # A API, o navegador isolado e o egress. Interna (item 6.19): sem rota para fora, sem DNS
  # externo e, com inhibit_ipv4 (Docker 28+), sem IP do host na bridge, entao nem o proprio host
  # e alcancavel. Os containers se veem pelo nome. Mudou isto? `docker compose down` antes do up.
  capture:
    driver: bridge
    internal: true
    driver_opts:
      com.docker.network.bridge.inhibit_ipv4: "true"
  # A API, o capa (item 7.2) e o Ghidra (7.3). Interna e sem IP do host na bridge, como a da
  # captura: eles nao alcancam nada alem da API, nem a internet.
  analysis:
    driver: bridge
    internal: true
    driver_opts:
      com.docker.network.bridge.inhibit_ipv4: "true"
  # So o egress: e por aqui que a captura chega a internet. Sub-rede fixa para o host poder
  # manda-la por uma VPN com roteamento por origem (docs/implantacao.md, passo 3), sem que a
  # captura saia pelo IP da casa. Se colidir com outra rede do host, troque no .env.
  capture-egress:
    driver: bridge
    ipam:
      config:
        - subnet: ${CAPTURE_EGRESS_SUBNET:-172.31.252.0/24}
