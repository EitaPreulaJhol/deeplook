<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" role="img" aria-label="DeepLook">
  <title>DeepLook — lock screen wallpaper</title>
  <desc>Versao para tela de bloqueio: o mesmo azul da topbar, afundado para um tom noturno, com a lupa do favicon e o nome DeepLook no canto inferior esquerdo (fora da area do relogio e do campo de senha).</desc>

  <defs>
    <!-- Mesmo matiz da topbar (dl topbar 1/2), com a luminosidade rebaixada:
         a tela de bloqueio escurece/desfoca o fundo antes de desenhar o login. -->
    <linearGradient id="lk-bg" x1="0.15" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#1b4b78"/>
      <stop offset="0.45" stop-color="#0f3355"/>
      <stop offset="0.78" stop-color="#082440"/>
      <stop offset="1" stop-color="#05192d"/>
    </linearGradient>

    <!-- Bolsao de luz no canto da marca: separa o logo do fundo -->
    <radialGradient id="lk-pool" cx="135" cy="945" r="1040" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8cc0ec" stop-opacity="0.26"/>
      <stop offset="0.30" stop-color="#6aa8de" stop-opacity="0.13"/>
      <stop offset="0.62" stop-color="#4d8bc8" stop-opacity="0.045"/>
      <stop offset="1" stop-color="#4d8bc8" stop-opacity="0"/>
    </radialGradient>

    <!-- Halo frio no alto a direita: tira o fundo do chapado -->
    <radialGradient id="lk-halo" cx="1560" cy="-140" r="1250" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#bcd9f2" stop-opacity="0.10"/>
      <stop offset="0.55" stop-color="#9cc4e8" stop-opacity="0.035"/>
      <stop offset="1" stop-color="#9cc4e8" stop-opacity="0"/>
    </radialGradient>

    <!-- Topo mais escuro: area onde caem o relogio e os avisos do SO -->
    <linearGradient id="lk-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#03101d" stop-opacity="0.38"/>
      <stop offset="0.42" stop-color="#03101d" stop-opacity="0"/>
    </linearGradient>

    <!-- Canto inferior esquerdo fecha em tom quase solido -->
    <radialGradient id="lk-corner" cx="0" cy="1" r="0.85">
      <stop offset="0" stop-color="#03101d" stop-opacity="0.42"/>
      <stop offset="0.55" stop-color="#03101d" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#03101d" stop-opacity="0"/>
    </radialGradient>

    <filter id="lk-mark-shadow" x="-80%" y="-80%" width="260%" height="260%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#000c16" flood-opacity="0.55"/>
    </filter>

    <filter id="lk-word-shadow" x="-40%" y="-80%" width="180%" height="260%">
      <feDropShadow dx="0" dy="3" stdDeviation="7" flood-color="#000c16" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Fundo: preenche a tela inteira (corta as bordas em proporcoes diferentes) -->
  <svg width="100%" height="100%" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
    <rect width="1920" height="1080" fill="url(#lk-bg)"/>

    <!-- Aros de lente concentricos na marca, no canto inferior esquerdo -->
    <g fill="none" stroke="#ffffff">
      <circle cx="135" cy="945" r="270" stroke-opacity="0.085" stroke-width="2"/>
      <circle cx="135" cy="945" r="460" stroke-opacity="0.06" stroke-width="1.75"/>
      <circle cx="135" cy="945" r="700" stroke-opacity="0.045" stroke-width="1.5"/>
      <circle cx="135" cy="945" r="980" stroke-opacity="0.032" stroke-width="1.5"/>
      <circle cx="135" cy="945" r="1300" stroke-opacity="0.024" stroke-width="1.5"/>
      <circle cx="135" cy="945" r="1680" stroke-opacity="0.018" stroke-width="1.5"/>
    </g>

    <rect width="1920" height="1080" fill="url(#lk-halo)"/>
    <rect width="1920" height="1080" fill="url(#lk-top)"/>
    <rect width="1920" height="1080" fill="url(#lk-corner)"/>
    <!-- O brilho entra por ultimo: nao deixa o escurecimento do canto apaga-lo -->
    <rect width="1920" height="1080" fill="url(#lk-pool)"/>
  </svg>

  <!-- Marca: ancorada no canto inferior esquerdo, escala inteira (meet) -->
  <svg width="100%" height="100%" viewBox="0 0 1920 1080" preserveAspectRatio="xMinYMax meet">
    <!-- Lupa do favicon (apps/web/public/icons/magnifier.svg) -->
    <g filter="url(#lk-mark-shadow)" opacity="0.94">
      <svg x="96" y="906" width="78" height="78" viewBox="1 1 13 13" overflow="visible">
        <defs>
          <linearGradient id="lk-handle" x1="11" y1="9" x2="11" y2="13" gradientUnits="userSpaceOnUse">
            <stop stop-color="#E8CBAB"/>
            <stop offset="1" stop-color="#DDB589"/>
          </linearGradient>
          <linearGradient id="lk-handle-stroke" x1="9" y1="10" x2="13" y2="12" gradientUnits="userSpaceOnUse">
            <stop stop-color="#DCAC78"/>
            <stop offset="1" stop-color="#975F18"/>
          </linearGradient>
          <linearGradient id="lk-lens" x1="1.00063" y1="1" x2="10.9994" y2="11" gradientUnits="userSpaceOnUse">
            <stop offset="0.22016" stop-color="#CCE1F6"/>
            <stop offset="0.785979" stop-color="#BBD6F3"/>
          </linearGradient>
          <linearGradient id="lk-lens-stroke" x1="1" y1="1.00742" x2="11" y2="10.9926" gradientUnits="userSpaceOnUse">
            <stop offset="0.151975" stop-color="#CDE2F9"/>
            <stop offset="0.851206" stop-color="#7CA1D0"/>
          </linearGradient>
        </defs>
        <path d="M13.5 12C13.5 11.8674 13.4473 11.7402 13.3536 11.6464L10.3536 8.64645C10.2598 8.55268 10.1326 8.5 10 8.5H9C8.72386 8.5 8.5 8.72386 8.5 9V10C8.5 10.1326 8.55268 10.2598 8.64645 10.3536L11.6464 13.3536C11.7402 13.4473 11.8674 13.5 12 13.5H13C13.2761 13.5 13.5 13.2761 13.5 13V12Z" fill="url(#lk-handle)" stroke="url(#lk-handle-stroke)" stroke-linejoin="round"/>
        <circle cx="6" cy="6" r="4.5" fill="url(#lk-lens)" stroke="url(#lk-lens-stroke)"/>
        <circle cx="6" cy="6" r="3.5" fill="none" stroke="#ffffff" stroke-opacity="0.33"/>
      </svg>
    </g>

    <!-- Nome, alinhado ao centro optico da lupa -->
    <text x="198" y="971" text-anchor="start"
          font-family="Tahoma, Arial, 'Liberation Sans', 'DejaVu Sans', Helvetica, sans-serif"
          font-size="72" font-weight="700" letter-spacing="0.5"
          fill="#f2f7fc" fill-opacity="0.94"
          filter="url(#lk-word-shadow)">DeepLook</text>
  </svg>
</svg>
