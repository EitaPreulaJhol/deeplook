# Varredura de CVE nas imagens (item 6.4 do plano de melhorias).
#
# O item 2.3 nasceu de um CVE do MinIO descoberto por acaso. O Dependabot cobre as tags do
# compose e dos Dockerfiles, mas nao o que as imagens ja montadas trazem por baixo (o Alpine do
# nginx, o Debian do node) nem a correcao que o Alpine publicou e a imagem oficial ainda nao
# incorporou. Esta esteira varre:
#   - as imagens do projeto, montadas aqui (inclusive o banco, de apps/db);
#   - as de terceiros, como o compose as resolve (docker compose config --images);
#   - os Dockerfiles (trivy config).
# Cada imagem do projeto tambem gera um SBOM em CycloneDX, guardado como artefato do job
# (sbom-<imagem>, 90 dias); o mesmo comando roda local: node scripts/trivy.mjs sbom <imagem> <arquivo>.
#
# Roda toda segunda-feira, a mao e em PR que mexa em Dockerfile, compose ou na configuracao
# do Trivy. Reprova em severidade ALTA ou CRITICA com correcao disponivel (trivy.yaml); a
# excecao se justifica em trivy.yaml ou no .trivyignore. O Trivy roda pela imagem oficial,
# sem acao de terceiros, e o mesmo comando roda local: node scripts/trivy.mjs image <imagem>.
name: Varredura de imagens

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/*/Dockerfile'
      - 'docker-compose.yml'
      - 'trivy.yaml'
      - '.trivyignore'
      - 'scripts/trivy.mjs'
      - '.github/workflows/security-scan.yml'

concurrency:
  group: scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Imagens que o compose usa e nao constroi (as construidas se chamam deeplook-*).
  # ---------------------------------------------------------------------------
  inventario:
    name: Imagens de terceiros do compose
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.lista.outputs.images }}
    steps:
      - uses: actions/checkout@v7

      - id: lista
        run: |
          images=$(docker compose config --images | grep -v '^deeplook-' | sort -u \
            | node -e "process.stdout.write(JSON.stringify(require('fs').readFileSync(0, 'utf8').split('\n').filter(Boolean)))")
          echo "images=$images" >> "$GITHUB_OUTPUT"
          echo "terceiros: $images"

  terceiros:
    name: Trivy (${{ matrix.image }})
    needs: inventario
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.inventario.outputs.images) }}
    steps:
      - uses: actions/checkout@v7

      - name: Varredura
        env:
          IMAGE: ${{ matrix.image }}
        run: node scripts/trivy.mjs image "$IMAGE"

  # ---------------------------------------------------------------------------
  # As imagens do projeto, montadas como em producao.
  # ---------------------------------------------------------------------------
  construidas:
    name: Trivy (imagem ${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # O egress (item 6.19) sai da pasta do capture, com Dockerfile proprio.
        include:
          # Banco do compose (item 6.4): base oficial pinada + apk upgrade, porque a imagem
          # oficial demora a ser refeita depois de uma correcao do Alpine.
          - { app: db, dir: db, dockerfile: Dockerfile }
          - { app: api, dir: api, dockerfile: Dockerfile }
          - { app: web, dir: web, dockerfile: Dockerfile }
          - { app: capture, dir: capture, dockerfile: Dockerfile }
          - { app: egress, dir: capture, dockerfile: Dockerfile.egress }
          # Analise de funcoes (item 7.2): capa e FLOSS, em Python.
          - { app: capa, dir: capa, dockerfile: Dockerfile }
          # Ghidra (item 7.3): os JARs dele entram na varredura (o guava ja foi trocado no build).
          - { app: ghidra, dir: ghidra, dockerfile: Dockerfile }
          # Desempacotar e extrair (item 7.8): upx, 7-Zip, innoextract e pyinstxtractor.
          - { app: unpack, dir: unpack, dockerfile: Dockerfile }
          - { app: oletools, dir: oletools, dockerfile: Dockerfile }
          # Novas analises: emulacao (Speakeasy), APK (androguard) e configuracao/memoria (CAPE).
          - { app: emulate, dir: emulate, dockerfile: Dockerfile }
          - { app: android, dir: android, dockerfile: Dockerfile }
          - { app: extract, dir: extract, dockerfile: Dockerfile }
          # Descompilacao de .NET (plans/caca-e-formatos, item 3): ilspycmd nativo e Python.
          - { app: dotnet, dir: dotnet, dockerfile: Dockerfile }
          # Descompilacao de Java: CFR numa JRE headless.
          - { app: jar, dir: jarcfr, dockerfile: Dockerfile }
          # Desofuscacao de JavaScript: webcrack (Node).
          - { app: jsdeob, dir: jsdeob, dockerfile: Dockerfile }
          # Descompilacao de Python: pycdc.
          - { app: pydec, dir: pydec, dockerfile: Dockerfile }
          # Modelos de ML: StringSifter e EMBER2024.
          - { app: ml, dir: ml, dockerfile: Dockerfile }
          # Captura de rede do sandbox (plano pos-revisao, 5.4): netcap (Node) e Suricata (Debian).
          - { app: netcap, dir: netcap, dockerfile: Dockerfile }
          - { app: suricata, dir: suricata, dockerfile: Dockerfile }
    steps:
      - uses: actions/checkout@v7

      - name: Montar a imagem
        run: >-
          docker build -t "deeplook-${{ matrix.app }}"
          -f "apps/${{ matrix.dir }}/${{ matrix.dockerfile }}" "apps/${{ matrix.dir }}"

      - name: Varredura
        run: node scripts/trivy.mjs image "deeplook-${{ matrix.app }}"

      # SBOM (CycloneDX) da imagem montada: o inventario de pacotes do sistema e das
      # dependencias de aplicacao, para saber o que uma imagem traz quando sair um CVE novo.
      # Roda mesmo se a varredura reprovou, que e quando o inventario mais interessa.
      - name: SBOM (CycloneDX)
        if: ${{ !cancelled() }}
        run: node scripts/trivy.mjs sbom "deeplook-${{ matrix.app }}" "sbom/${{ matrix.app }}.cdx.json"

      - name: Guardar o SBOM
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ matrix.app }}
          path: sbom/${{ matrix.app }}.cdx.json
          if-no-files-found: error
          retention-days: 90

  # ---------------------------------------------------------------------------
  # Erros de configuracao nos Dockerfiles (usuario root, segredo na imagem...).
  # ---------------------------------------------------------------------------
  dockerfiles:
    name: Trivy (Dockerfiles)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Varredura de configuracao
        run: node scripts/trivy.mjs config apps

  # ---------------------------------------------------------------------------
  # Aviso do schedule: um X vermelho so notifica o ultimo autor de commit. Abre (ou
  # comenta) uma issue com os jobs que falharam, para o achado nao morrer no log.
  # ---------------------------------------------------------------------------
  alerta:
    name: Aviso da varredura semanal
    needs: [terceiros, construidas, dockerfiles]
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      issues: write
    steps:
      - name: Abrir ou atualizar a issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          jobs=$(gh run view "$GITHUB_RUN_ID" --json jobs \
            --jq '[.jobs[] | select(.conclusion == "failure") | "- `\(.name)`"] | join("\n")')
          body=$(printf 'Run: %s/%s/actions/runs/%s\n\nJobs com falha:\n%s\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$jobs")
          existing=$(gh issue list --state open \
            --search 'Varredura semanal de imagens reprovou in:title' \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title 'Varredura semanal de imagens reprovou' --body "$body"
          fi
