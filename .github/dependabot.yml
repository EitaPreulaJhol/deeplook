# Atualizacao de dependencias (item 2.3 do plano de melhorias).
#
# A troca do MinIO pelo pgsty/silo (CVE-2026-40344 e CVE-2026-41145) foi
# reativa, descoberta durante uma rodada do Strix. Isto avisa antes.
#
# Os patches vem agrupados num unico PR por app, para nao encher a fila; o que
# sobe de versao maior vem separado, porque exige leitura.
version: 2

updates:
  - package-ecosystem: npm
    directory: /apps/api
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      patches:
        update-types: [minor, patch]
    # O Prisma sobe cliente, adapter e CLI juntos, ou o build quebra.
    ignore:
      - dependency-name: '@prisma/*'
        update-types: [version-update:semver-major]
      - dependency-name: prisma
        update-types: [version-update:semver-major]
      # O TypeScript 7 (o compilador nativo) ainda nao tem suporte no typescript-eslint, e o
      # npm install falha (ERESOLVE). Liberar quando o typescript-eslint aceitar o 7.
      - dependency-name: typescript
        versions: ['>= 7']

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      patches:
        update-types: [minor, patch]
    ignore:
      # O TypeScript 7 (o compilador nativo) ainda nao tem suporte no typescript-eslint, e o
      # npm install falha (ERESOLVE). Liberar quando o typescript-eslint aceitar o 7.
      - dependency-name: typescript
        versions: ['>= 7']

  - package-ecosystem: npm
    directory: /apps/capture
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      patches:
        update-types: [minor, patch]
    # O pacote e a imagem do Playwright precisam subir juntos (item 6.2): um PR so do
    # npm quebraria a captura sem o CI notar. Troca manual; scripts/check-playwright-version.mjs
    # confere os lugares no CI.
    ignore:
      - dependency-name: playwright

  # Office e PDF mais fundo (revisao de novembro, 3.2): o lockfile com hash do oletools.
  - package-ecosystem: pip
    directory: /apps/oletools
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      patches:
        update-types: [minor, patch]

  # Novas analises (emulacao, APK e configuracao/memoria): os lockfiles com hash do pip-compile.
  # O unicorn do emulate fica no 1.0.2 (o Speakeasy o fixa); o CAPE-parsers sobe a mao, junto com
  # as regras do CAPEv2 em apps/extract/rules (mesma epoca).
  - package-ecosystem: pip
    directories:
      - /apps/emulate
      - /apps/android
      - /apps/extract
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      patches:
        update-types: [minor, patch]
    ignore:
      - dependency-name: unicorn
      - dependency-name: cape-parsers
      # O unicorn 1.0.2 do emulate importa o pkg_resources, que saiu no setuptools 82.
      - dependency-name: setuptools
        versions: ['>= 82']

  # Analise de funcoes (item 7.2): o lockfile com hash do pip-compile (requirements.in). O capa
  # e o FLOSS sobem a mao: as regras e as assinaturas baixadas no Dockerfile (URL, hash e
  # CAPA_RULES_VERSION) tem de ser da mesma versao do capa, e um PR so do pip as deixaria para tras.
  - package-ecosystem: pip
    directory: /apps/capa
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      patches:
        update-types: [minor, patch]
    ignore:
      - dependency-name: flare-capa
      - dependency-name: flare-floss

  # Imagens base dos Dockerfiles (node, nginx, python e debian; o playwright e manual, ver abaixo).
  # O Ghidra em si (pacote, hash, Java e a troca do guava no Dockerfile) sobe a mao.
  - package-ecosystem: docker
    directories:
      - /apps/api
      - /apps/web
      - /apps/capture
      - /apps/capa
      - /apps/ghidra
      - /apps/unpack
      - /apps/oletools
      - /apps/netcap
      - /apps/suricata
      - /apps/android
      - /apps/dotnet
      - /apps/jarcfr
      - /apps/jsdeob
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    ignore:
      # So LTS (item 6.3): a major seguinte do Node costuma ser a Current (sem LTS), e
      # a troca para o proximo LTS e manual e deliberada. As tags sao flutuantes (26-slim),
      # entao o patch vem a cada rebuild; o Trivy semanal avisa de base velha.
      - dependency-name: node
        update-types: ['version-update:semver-major']
      # Sobe junto com o pacote npm, a mao (item 6.2). O Dependabot chama a imagem so de
      # "playwright" (foi assim que ele abriu o PR da 1.65.1), entao vale ignorar os dois nomes.
      - dependency-name: mcr.microsoft.com/playwright
      - dependency-name: playwright
      # Python 3.15: o python-flirt do capa usa o PyO3, que so vai ate o 3.14, e o pillow e o
      # zxing-cpp do oletools nao tem wheel para o 3.15 (o build compila e falha). O 3.13 e o
      # 3.14 continuam chegando; liberar o 3.15 quando essas dependencias o suportarem.
      - dependency-name: python
        versions: ['>= 3.15']

  # Emulacao (Speakeasy): fica no Python 3.11, porque o unicorn 1.0.2 importa o distutils, que saiu
  # no 3.12. So os patches do 3.11.
  - package-ecosystem: docker
    directory: /apps/emulate
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: python
        versions: ['>= 3.12']

  # Configuracao de familias (CAPE-parsers): fica no Python 3.13, porque o yara-python 4.5.4 nao tem
  # wheel para o 3.14 (o build compila e falha sem gcc). Liberar quando sair o wheel cp314.
  - package-ecosystem: docker
    directory: /apps/extract
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: python
        versions: ['>= 3.14']

  # As imagens de terceiros do docker-compose.yml (Postgres e ClamAV), fixadas por tag e digest:
  # o Dependabot abre o PR quando a tag ganha uma imagem nova; a mao, node scripts/pin-images.mjs
  # --write faz o mesmo. O MinIO (pgsty/silo) fica fora: o compose o le de ${MINIO_IMAGE:-...},
  # que o Dependabot nao entende, e o digest sobe a mao (o Trivy semanal avisa).
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: postgres
        update-types: ['version-update:semver-major']

  # As acoes usadas nos workflows (checkout, setup-node, upload-artifact).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
