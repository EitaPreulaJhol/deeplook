# Atualizacao de dependencias (item 2.3 do plano de melhorias).
#
# A troca do MinIO pelo pgsty/silo (CVE-2026-40344 e CVE-2026-41145) foi
# reativa, descoberta durante uma rodada do Strix. Isto avisa antes.
#
# Os patches vem agrupados num unico PR por app, para nao encher a fila; o que
# sobe de versao maior vem separado, porque exige leitura.
version: 2

updates:
  - package-ecosystem: npm
    directory: /apps/api
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      patches:
        update-types: [minor, patch]
    # O Prisma sobe cliente, adapter e CLI juntos, ou o build quebra.
    ignore:
      - dependency-name: '@prisma/*'
        update-types: [version-update:semver-major]
      - dependency-name: prisma
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      patches:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /apps/capture
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      patches:
        update-types: [minor, patch]
    # O pacote e a imagem do Playwright precisam subir juntos (item 6.2): um PR so do
    # npm quebraria a captura sem o CI notar. Troca manual; scripts/check-playwright-version.mjs
    # confere os lugares no CI.
    ignore:
      - dependency-name: playwright

  # Imagens base dos tres Dockerfiles (node e nginx; o playwright e manual, ver abaixo).
  - package-ecosystem: docker
    directories:
      - /apps/api
      - /apps/web
      - /apps/capture
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    ignore:
      # So LTS (item 6.3): a major seguinte do Node costuma ser a Current (sem LTS), e
      # a troca para o proximo LTS e manual e deliberada. As tags sao flutuantes (26-slim),
      # entao o patch vem a cada rebuild; o Trivy semanal avisa de base velha.
      - dependency-name: node
        update-types: ['version-update:semver-major']
      # Sobe junto com o pacote npm, a mao (item 6.2).
      - dependency-name: mcr.microsoft.com/playwright

  # As acoes usadas no ci.yml (checkout, setup-node).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
