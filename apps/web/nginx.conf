# Log sem a query string nem o referer (item 163): a busca e a consulta de indicador
# levam URLs de vitima, com token ou e-mail. O referer, no proprio site, e a URL inteira.
log_format deeplook '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent "$http_user_agent"';

server {
    # 8080: a imagem roda sem root (item 6.5) e nao pode abrir porta abaixo de 1024. O host
    # continua publicando 127.0.0.1:8080, entao o cloudflared nao muda.
    listen 8080;
    server_name _;
    access_log /var/log/nginx/access.log deeplook;

    root /usr/share/nginx/html;
    index index.html;

    # Permite o upload de amostras grandes
    client_max_body_size 1024m;
    client_body_timeout 300s;

    # IP real (item 112): o Cloudflare Tunnel chega pelo cloudflared do host, pela porta
    # publicada em 127.0.0.1, e o nginx o ve como o gateway da rede `deeplook` (medido). So desse
    # endereco, e do loopback, o CF-Connecting-IP vale: qualquer faixa privada (como antes)
    # deixava outro container, ou um proxy que repassasse o cabecalho do cliente, forjar o IP e
    # furar os limites de login por IP. Sem o cabecalho (teste, sem proxy), vale a conexao.
    # Este arquivo e um modelo: o entrypoint da imagem troca so o REAL_IP_FROM (compose) e
    # grava o resultado em /tmp, porque a raiz e somente leitura.
    set_real_ip_from 127.0.0.0/8;
    set_real_ip_from ::1;
    set_real_ip_from ${REAL_IP_FROM};
    real_ip_header CF-Connecting-IP;

    # Nao revela a versao do nginx no cabecalho Server nem no corpo das paginas de erro.
    server_tokens off;

    # Headers de seguranca (itens 115 e 4.1). Cada add_header precisa de `always`,
    # senao nao sai nas respostas de erro; e um add_header dentro de um `location`
    # substituiria todos estes, entao os blocos abaixo nao tem add_header proprio.
    # HSTS: o navegador so respeita sob HTTPS.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # includeSubDomains estende o HSTS aos subdominios; sem `preload` de proposito
    # (compromisso dificil de desfazer, e o dominio e de homelab).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # O app nao usa camera, microfone, geolocalizacao nem pagamento: desliga os quatro.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # Isolamento de origem (item 6.7): nenhuma janela de outra origem ganha referencia a esta
    # pagina, e nenhum site de fora embute os recursos do DeepLook.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    # connect-src 'self' cobre o WebSocket do console na mesma origem (CSP 3: Chromium, Firefox e
    # Safari 15.4+); com `ws: wss:` soltos, um script injetado falaria com qualquer servidor.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    # Compressao (item 6.7): o nivel padrao do nginx e o 1 (o mais rapido e o que menos comprime).
    # O 6 tira cerca de 30% do CSS e do JS sem custo que se note, porque os assets saem do cache
    # (um ano). O Vary evita que um cache entregue a versao compactada a quem nao a entende.
    gzip on;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/javascript text/xml application/xml image/svg+xml;

    # Console do sandbox: WebSocket do noVNC (tunel browser -> API -> PVE).
    # Sem a barra final para o nginx nao redirecionar /api/sandbox (301).
    location /api/sandbox {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Proxy para a API
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    # Assets do Vite (item 6.7): o nome leva o hash do conteudo, entao um ano de cache e
    # seguro. try_files com =404: sem ele, um asset que nao existe (pagina velha depois de um
    # deploy) cairia no fallback da SPA e voltaria index.html com 200 e um ano de cache.
    # `expires`, e nao add_header, de proposito: um add_header aqui descartaria os cabecalhos
    # de seguranca do servidor, e o `expires` nao.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # SPA fallback. Fora dos assets nada fica em cache sem revalidar: o index.html e quem
    # aponta para os assets novos.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
