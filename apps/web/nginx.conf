# Log sem a query string nem o referer (item 163): a busca e a consulta de indicador
# levam URLs de vitima, com token ou e-mail. O referer, no proprio site, e a URL inteira.
log_format deeplook '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent "$http_user_agent"';

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log deeplook;

    root /usr/share/nginx/html;
    index index.html;

    # Permite o upload de amostras grandes
    client_max_body_size 1024m;
    client_body_timeout 300s;

    # IP real (item 112): o Cloudflare Tunnel chega pelo cloudflared local, em rede
    # privada, com o CF-Connecting-IP. Sem esse cabecalho (teste, sem proxy), vale a
    # conexao; de endereco publico, ele e ignorado.
    set_real_ip_from 127.0.0.0/8;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from ::1;
    set_real_ip_from fc00::/7;
    real_ip_header CF-Connecting-IP;

    # Nao revela a versao do nginx no cabecalho Server nem no corpo das paginas de erro.
    server_tokens off;

    # Headers de seguranca (itens 115 e 4.1). Cada add_header precisa de `always`,
    # senao nao sai nas respostas de erro; e um add_header dentro de um `location`
    # substituiria todos estes, entao os blocos abaixo nao tem add_header proprio.
    # HSTS: o navegador so respeita sob HTTPS.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # includeSubDomains estende o HSTS aos subdominios; sem `preload` de proposito
    # (compromisso dificil de desfazer, e o dominio e de homelab).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # O app nao usa camera, microfone, geolocalizacao nem pagamento: desliga os quatro.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Console do sandbox: WebSocket do noVNC (tunel browser -> API -> PVE).
    # Sem a barra final para o nginx nao redirecionar /api/sandbox (301).
    location /api/sandbox {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Proxy para a API
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
